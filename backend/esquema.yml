  /api/casos:
    get:
      operationId: casos_list
      description: |-
        Para toda vista que toca datos de un laboratorio. Es la única barrera contra que un
        laboratorio vea lo de otro: una vista que consulte `Modelo.objects.get(pk=...)` a
        secas reintroduce la fuga. Un objeto de otro laboratorio da 404, igual que uno que
        no existe: no se distingue "existe pero no es tuyo".
      parameters:
      - in: query
        name: cliente
        schema:
          type: string
      - in: query
        name: estado
        schema:
          type: string
          enum:
          - abierto
          - cancelado
          - entregado
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: offset
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Número, paciente, cliente o profesional
      tags:
      - casos
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Caso'
          description: ''
    post:
      operationId: casos_create
      description: |-
