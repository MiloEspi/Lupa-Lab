name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: lupalab
          POSTGRES_USER: lupalab
          POSTGRES_PASSWORD: lupalab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lupalab" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgres://lupalab:lupalab@localhost:5432/lupalab
      DEBUG: "True"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest --create-db
      # El esquema commiteado tiene que coincidir con el código: de él salen los tipos del front.
      - run: python manage.py spectacular --file esquema.yml && git diff --exit-code esquema.yml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api && git diff --exit-code src/api/esquema.d.ts
      - run: npm run lint
      - run: npm run build
